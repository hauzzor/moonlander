<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moonlander</title>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Moonlander</h1>
      </header>
      <main class="game">
        <div class="hud" aria-live="polite">
          <div class="hud-item" data-testid="hud-altitude" data-value="0">
            ALT <span class="hud-value">0</span>m
          </div>
          <div class="hud-item" data-testid="hud-vspeed" data-value="0">
            V.SPD <span class="hud-value">0</span>m/s
          </div>
          <div class="hud-item" data-testid="hud-hspeed" data-value="0">
            H.SPD <span class="hud-value">0</span>m/s
          </div>
          <div class="hud-item" data-testid="hud-tilt" data-value="0">
            TILT <span class="hud-value">0</span>°
          </div>
          <div class="hud-item" data-testid="hud-fuel" data-value="0">
            FUEL <span class="hud-value">0</span>%
          </div>
          <div
            class="hud-item thruster"
            data-testid="thruster-left"
            data-active="false"
          >
            L
          </div>
          <div
            class="hud-item thruster"
            data-testid="thruster-right"
            data-active="false"
          >
            R
          </div>
        </div>
        <canvas
          id="game-canvas"
          data-testid="game-canvas"
          aria-label="Moonlander game canvas"
        ></canvas>
        <div class="instructions" data-testid="instructions">
          <kbd>Q</kbd> left thruster &nbsp; <kbd>W</kbd> right thruster &nbsp;
          <kbd>R</kbd> restart
        </div>
        <div class="outcome hidden" data-testid="outcome" role="status">
          <span class="outcome-text"></span>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
